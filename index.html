<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tus Ojos ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: #0f172a;
      touch-action: manipulation;
    }

    h1 {
      position: absolute;
      top: 30px;
      font-size: 1.3rem;
      color: #1e293b;
      text-align: center;
      padding: 0 15px;
      z-index: 10;
      pointer-events: none;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #f8fafc;
    }

    .instructions {
      position: absolute;
      bottom: 25px;
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <h1>Hay miradas que no se olvidan 👁️✨</h1>
  <canvas id="halftoneCanvas"></canvas>
  <div class="instructions">Toca 1 vez para guiñar • Toca 2 veces para cerrar ambos ojos</div>

  <script>
    const canvas = document.getElementById('halftoneCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Estados de interacción
    let mouse = { x: width / 2, y: height / 2 };
    let isWinking = false;
    let isBothClosed = false;
    let clickTimer = null;
    let tapCount = 0;

    // Seguimiento del ratón y touch
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    // Manejo limpio de 1 toque vs 2 toques
    window.addEventListener('pointerdown', () => {
      tapCount++;
      if (tapCount === 1) {
        clickTimer = setTimeout(() => {
          // Un solo toque: Guiña el ojo derecho
          isWinking = true;
          isBothClosed = false;
          setTimeout(() => { isWinking = false; }, 600);
          tapCount = 0;
        }, 250);
      } else if (tapCount === 2) {
        // Doble toque: Cierra ambos ojos juntos
        clearTimeout(clickTimer);
        isBothClosed = true;
        isWinking = false;
        setTimeout(() => { isBothClosed = false; }, 1200);
        tapCount = 0;
      }
    });

    // Puntos fijos de la matriz Halftone
    class HalftoneDot {
      constructor(baseX, baseY, type, isRightEye = false) {
        this.baseX = baseX;
        this.baseY = baseY;
        this.type = type; // 'brow', 'lash', 'lid', 'iris', 'pupil', 'glint'
        this.isRightEye = isRightEye;

        // Tamaño y Color base según el elemento
        if (type === 'pupil') {
          this.baseRadius = 3.5;
          this.color = '#090d16'; // Negro intenso
        } else if (type === 'iris') {
          this.baseRadius = 2.8;
          this.color = '#0284c7'; // Azul celeste brillante
        } else if (type === 'glint') {
          this.baseRadius = 2.5;
          this.color = '#ffffff'; // Destello blanco
        } else if (type === 'brow') {
          this.baseRadius = 2.2;
          this.color = '#1e293b'; // Puntos oscuros ceja
        } else if (type === 'lash') {
          this.baseRadius = 2.5;
          this.color = '#0f172a'; // Pestañas oscuras
        } else {
          this.baseRadius = 2.0;
          this.color = '#334155'; // Párpados
        }

        this.currentX = baseX;
        this.currentY = baseY;
        this.radius = this.baseRadius;
      }

      update() {
        let targetX = width / 2 + this.baseX;
        let targetY = height / 2 + this.baseY;

        // Movimiento de pupila / iris azul con el cursor
        if (this.type === 'pupil' || this.type === 'iris' || this.type === 'glint') {
          let dx = (mouse.x - width / 2) * 0.04;
          let dy = (mouse.y - height / 2) * 0.04;
          targetX += dx;
          targetY += dy;
        }

        // Cierre de ojos: Ambos o Guiño
        let shouldClose = isBothClosed || (isWinking && this.isRightEye);

        if (shouldClose) {
          if (this.type !== 'brow') {
            targetY = height / 2 + 10; // Todos los puntos se pliegan a la línea central
          }
        }

        this.currentX += (targetX - this.currentX) * 0.15;
        this.currentY += (targetY - this.currentY) * 0.15;
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.currentX, this.currentY, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const dots = [];

    function generateHalftoneEyes() {
      dots.length = 0;
      const eyeCenters = [-110, 110];

      eyeCenters.forEach((cx, index) => {
        const isRight = index === 1;

        // 1. CEJAS (Puntos Negros/Gris Oscuro)
        for (let x = -65; x <= 65; x += 6) {
          let normX = x / 65;
          let y = -70 - (1 - normX * normX) * 16 + (x > 0 ? x * 0.1 : 0);
          dots.push(new HalftoneDot(cx + x, y, 'brow', isRight));
          dots.push(new HalftoneDot(cx + x, y + 4, 'brow', isRight));
        }

        // 2. PESTAÑAS Y PÁRPADO SUPERIOR (Puntos Negros densos)
        for (let x = -60; x <= 60; x += 5) {
          let normX = x / 60;
          let y = -12 - Math.cos(normX * Math.PI * 0.5) * 22;
          dots.push(new HalftoneDot(cx + x, y, 'lash', isRight));
          dots.push(new HalftoneDot(cx + x, y - 4, 'lash', isRight));

          // Pestañas proyectadas hacia arriba
          if (x % 10 === 0) {
            dots.push(new HalftoneDot(cx + x * 1.1, y - 8, 'lash', isRight));
          }
        }

        // 3. PÁRPADO INFERIOR
        for (let x = -50; x <= 50; x += 6) {
          let normX = x / 50;
          let y = -4 + Math.cos(normX * Math.PI * 0.5) * 16;
          dots.push(new HalftoneDot(cx + x, y, 'lid', isRight));
        }

        // 4. IRIS (ÚNICAMENTE PUNTOS AZULES)
        for (let r = 5; r <= 22; r += 4.5) {
          for (let a = 0; a < Math.PI * 2; a += 0.35) {
            let rx = r * Math.cos(a);
            let ry = r * Math.sin(a);
            // Corte para mantener la forma redonda dentro del párpado
            if (Math.abs(rx) < 22) {
              dots.push(new HalftoneDot(cx + rx, ry - 3, 'iris', isRight));
            }
          }
        }

        // 5. PUPILA (Puntos Negros centrales)
        for (let r = 0; r <= 8; r += 3.5) {
          for (let a = 0; a < Math.PI * 2; a += 0.6) {
            let rx = r * Math.cos(a);
            let ry = r * Math.sin(a);
            dots.push(new HalftoneDot(cx + rx, ry - 3, 'pupil', isRight));
          }
        }

        // 6. DESTELLO (Puntos Blancos)
        dots.push(new HalftoneDot(cx - 5, -8, 'glint', isRight));
      });
    }

    generateHalftoneEyes();

    function animate() {
      ctx.clearRect(0, 0, width, height);

      dots.forEach(dot => {
        dot.update();
        dot.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
